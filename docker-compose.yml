# ===== Policy_Reporter Docker 编排配置（生产 + 本地两用） =====
# 使用：
#   本地开发：docker-compose up -d
#   生产部署：把 .env 填好后 docker-compose up -d
# 强制要求 .env 文件提供 SECRET_KEY / DB_ROOT_PASSWORD / DEEPSEEK_API_KEY

services:
  # ===== MySQL 数据库 =====
  db:
    image: mysql:8.0
    container_name: policy_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD 必须在 .env 中提供}
      MYSQL_DATABASE: policy_db
    # 仅绑定回环地址：宿主机本地工具可用，外部无法绕过 Nginx 直连数据库
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ===== Django 后端 =====
  backend:
    build: ./backend
    container_name: policy_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 强制从 .env 读，不给不安全默认值
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY 必须在 .env 中提供}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-backend,localhost}
      DATABASE_URL: mysql://root:${DB_ROOT_PASSWORD}@db:3306/policy_db
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY 必须在 .env 中提供}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      # admin 白名单（逗号分隔 IP；留空=不限制，见 config/middleware.py）
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}
      # entrypoint.sh 等 DB 用的连接参数
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: policy_db
    # 仅绑定回环地址：本地开发（Vite 直连 8000）可用，外部必须经 Nginx 反代
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # 持久化 media 目录（Agent 生成的 docx 不随容器重启丢失）
      - backend_media:/app/media
      - backend_static:/app/staticfiles

  # ===== Vue 前端（Nginx 反代） =====
  frontend:
    build: ./frontend
    container_name: policy_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 与 backend 共享 collectstatic 产物，nginx 直接服务 /static/（不再反代 gunicorn）
      - backend_static:/app/staticfiles:ro

volumes:
  db_data:
  backend_media:
  backend_static:
