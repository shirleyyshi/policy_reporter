# ===== Nginx 配置（生产：前端静态 + 后端 API 反代 + Django 静态/media） =====
server {
    listen 80;
    server_name localhost;

    # 前端 SPA 静态资源
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Agent run 可能耗时较长，超时放宽
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # Django admin 静态文件：backend 的 collectstatic 产物经共享卷（backend_static）直接服务
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        access_log off;
    }

    # /media/ 不经 nginx 暴露：Agent docx 下载走鉴权 API /api/agent/runs/<id>/download/
    # 显式 404，防止落入下方 SPA 兜底返回 index.html（200）造成误判
    location /media/ {
        return 404;
    }
}
